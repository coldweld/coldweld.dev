<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coldweld</title>
<meta name="description" content="Coldweld. Independent game studio.">

<meta property="og:title" content="Coldweld">
<meta property="og:description" content="Independent game studio.">
<meta property="og:url" content="https://coldweld.dev">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0b0a08;
    --panel:     #131109;
    --rule:      #2a2419;
    --amber:     #ffb000;
    --amber-dim: #8a6410;
    --bone:      #d6cbb6;
    --muted:     #6f6754;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--bone);
    font-family: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    padding: 0 24px 96px;
  }

  /* BACKGROUND */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 176, 0, 0.022) 0px,
      rgba(255, 176, 0, 0.022) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  .sheet {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
  }

  /* masthead */

  .masthead {
    padding: 88px 0 44px;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    margin: 0;
    font-family: "Martian Mono", monospace;
    font-size: clamp(26px, 7.5vw, 48px);
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.05;
    color: var(--amber);
    text-shadow: 0 0 22px rgba(255, 176, 0, 0.28);
  }

  .role {
    margin: 18px 0 0;
    font-family: "Martian Mono", monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* blocks */

  .block { padding: 34px 0; border-bottom: 1px solid var(--rule); }

  .eyebrow {
    margin: 0 0 18px;
    font-family: "Martian Mono", monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .project-title {
    margin: 0;
    font-size: clamp(17px, 4vw, 21px);
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--bone);
  }

  .project-state {
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* channels */

  .channels { list-style: none; margin: 0; padding: 0; }

  .channels li + li { border-top: 1px solid var(--rule); }

  .row {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: baseline;
    gap: 14px;
    padding: 14px 2px;
    text-decoration: none;
    color: var(--bone);
  }

  a.row:hover,
  a.row:focus-visible {
    background: var(--panel);
    color: var(--amber);
  }

  a.row:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }

  .dot { color: var(--amber); line-height: 1; font-size: 11px; }

  .name { letter-spacing: 0.06em; }

  .state {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-dim);
  }

  .row.is-pending { color: var(--muted); cursor: default; }
  .row.is-pending .dot,
  .row.is-pending .state { color: var(--muted); }

  /* contact */

  .contact-link {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid var(--amber-dim);
    padding-bottom: 2px;
    font-size: 16px;
  }

  .contact-link:hover,
  .contact-link:focus-visible { border-bottom-color: var(--amber); }

  .contact-link:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }

  /* colophon */

  .colophon {
    padding-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<main class="sheet">

  <header class="masthead">
    <h1 class="wordmark">COLDWELD</h1>
    <p class="role">Independent game studio</p>
  </header>

  <section class="block">
    <p class="eyebrow">Current project</p>
    <h2 class="project-title">THE INFINITE DIASPORA</h2>
    <p class="project-state">In development.</p>
  </section>

  <section class="block">
    <p class="eyebrow">Channels</p>
    <ul class="channels">

      <li>
        <a class="row" href="https://bsky.app/profile/coldweld.bsky.social">
          <span class="dot" aria-hidden="true">&#9679;</span>
          <span class="name">Bluesky</span>
          <span class="state">Online</span>
        </a>
      </li>

      <li>
        <a class="row" href="https://coldweld.itch.io">
          <span class="dot" aria-hidden="true">&#9679;</span>
          <span class="name">itch.io</span>
          <span class="state">Online</span>
        </a>
      </li>

      <li>
        <a class="row" href="https://discord.gg/dBnWvCbTbE">
          <span class="dot" aria-hidden="true">&#9679;</span>
          <span class="name">Discord</span>
          <span class="state">Online</span>
        </a>
      </li>

      <li>
        <a class="row" href="https://github.com/coldweld">
          <span class="dot" aria-hidden="true">&#9679;</span>
          <span class="name">GitHub</span>
          <span class="state">Online</span>
        </a>
      </li>

      <li>
        <a class="row" href="https://youtube.com/@coldwelddev">
          <span class="dot" aria-hidden="true">&#9679;</span>
          <span class="name">YouTube</span>
          <span class="state">Online</span>
        </a>
      </li>

      <li>
        <div class="row is-pending">
          <span class="dot" aria-hidden="true">&#9675;</span>
          <span class="name">Steam</span>
          <span class="state">Pending</span>
        </div>
      </li>

    </ul>
  </section>

  <section class="block">
    <p class="eyebrow">Contact</p>
    <a class="contact-link" href="mailto:hello@coldweld.dev">hello@coldweld.dev</a>
  </section>

  <div class="colophon">
    <span>coldweld.dev</span>
    <span>&copy; 2026 Coldweld</span>
  </div>

</main>
</body>
</html>
